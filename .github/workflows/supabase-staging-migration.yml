name: Deploy Supabase username migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-staging-migration.yml"
      - "scripts/apply_supabase_migration_mcp.py"
      - "supabase/migrations/20260727210000_username_availability_v1.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-username-availability
  cancel-in-progress: false

jobs:
  migrate:
    name: Verify staging through Supabase MCP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_MCP_ENDPOINT: https://mcp.supabase.com/mcp?project_ref=aeurigbbohyxvtsfiyul&features=database

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Supabase access token
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Apply and verify username availability migration
        run: |
          python3 scripts/apply_supabase_migration_mcp.py \
            --endpoint "$SUPABASE_MCP_ENDPOINT" \
            --migration supabase/migrations/20260727210000_username_availability_v1.sql \
            --name username_availability_v1

  deploy-production:
    name: Preflight and deploy production through Supabase MCP
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_MCP_ENDPOINT: https://mcp.supabase.com/mcp?project_ref=gomdoguewaawdlvijahg&features=database

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Supabase access token
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi

      - name: Preflight, apply, and verify username availability migration
        run: |
          python3 scripts/apply_supabase_migration_mcp.py \
            --endpoint "$SUPABASE_MCP_ENDPOINT" \
            --project-id gomdoguewaawdlvijahg \
            --migration supabase/migrations/20260727210000_username_availability_v1.sql \
            --name username_availability_v1
