name: CI

on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
  merge_group:

# Required so the "Comment PR with results" step can post/update PR comments.
# Without pull-requests: write the github-script call fails with
# "Resource not accessible by integration".
permissions:
  contents: read
  pull-requests: write

jobs:
  validation:
    name: PR Validation
    runs-on: macos-15
    # Skip automated bump commits pushed by deploy.yml ([skip ci]).
    if: |
      github.event_name == 'pull_request' ||
      github.event_name == 'merge_group' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for diff comparison
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Show available SDKs
        run: xcodebuild -showsdks
      
      - name: List available simulators
        run: xcrun simctl list devices available
      
      - name: Cache Swift Package Manager
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            .build
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-
      
      - name: Install dependencies
        run: |
          brew install xcbeautify
          brew install jq  # Required for coverage validation

      - name: Secret scan
        run: |
          chmod +x scripts/secret_scan.sh
          ./scripts/secret_scan.sh
      
      - name: Show available destinations
        run: |
          xcodebuild \
            -scheme SpotTests \
            -showdestinations
      
      - name: Validate API Changes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          echo "Checking for breaking API changes..."
          ./scripts/validate-api-changes.sh origin/${{ github.base_ref }}
      
      - name: Validate Documentation
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          echo "Validating documentation updates..."
          ./scripts/validate-documentation.sh origin/${{ github.base_ref }}
      
      - name: Run Unit Tests
        id: tests
        run: |
          set -o pipefail
          
          # Run unit tests only (SpotTests scheme)
          # Use any available iOS Simulator
          xcodebuild \
            -scheme SpotTests \
            -destination "platform=iOS Simulator,name=iPhone 16" \
            -parallel-testing-enabled NO \
            -maximum-parallel-testing-workers 1 \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            test | xcbeautify
      
      - name: Extract unit-test scope coverage
        id: coverage
        if: always()
        run: |
          if [ -d "TestResults.xcresult" ]; then
            if xcrun xccov view --report --json TestResults.xcresult > coverage-report.json &&
              SUMMARY=$(python3 scripts/summarize-xccov.py coverage-report.json); then
              PERCENT=$(jq -r '.percent' <<< "$SUMMARY")
              COVERED=$(jq -r '.coveredLines' <<< "$SUMMARY")
              EXECUTABLE=$(jq -r '.executableLines' <<< "$SUMMARY")
              echo "Spot unit-test scope coverage: ${PERCENT}% (${COVERED}/${EXECUTABLE} lines)"
              echo "percent=${PERCENT}" >> "$GITHUB_OUTPUT"
              echo "covered=${COVERED}" >> "$GITHUB_OUTPUT"
              echo "executable=${EXECUTABLE}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "percent=unknown" >> "$GITHUB_OUTPUT"
      
      - name: Validate Code Coverage
        id: coverage_validation
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        run: |
          set -o pipefail
          echo "Validating coverage of the lines changed by this PR..."
          # Args: <xcresult> <base-branch> <threshold %> <min changed executable
          # lines before the threshold is enforced>.
          ./scripts/validate-coverage.sh TestResults.xcresult origin/${{ github.base_ref }} 80 10 2>&1 | tee coverage-report.txt
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults.xcresult
          retention-days: 7
      
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-reports
          path: |
            coverage-report.json
            coverage-report.txt
            ~/Library/Developer/Xcode/DerivedData/**/ProfileData
          retention-days: 7
      
      - name: Generate coverage report summary
        if: always()
        run: |
          if [ -d "TestResults.xcresult" ]; then
            echo "## Code Coverage Summary" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            PERCENT="${{ steps.coverage.outputs.percent }}"
            if [ -n "$PERCENT" ] && [ "$PERCENT" != "unknown" ]; then
              echo "**Spot unit-test scope:** ${PERCENT}% (${{ steps.coverage.outputs.covered }}/${{ steps.coverage.outputs.executable }} executable lines)" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "This informational metric includes non-view production Swift files in Spot.app. Package dependencies, tests, and SwiftUI views are excluded." >> $GITHUB_STEP_SUMMARY
            else
              echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
            fi
          fi
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            const testsOutcome = '${{ steps.tests.outcome }}';
            const coverageOutcome = '${{ steps.coverage_validation.outcome }}';
            const unitScopeCoverage = '${{ steps.coverage.outputs.percent }}';
            
            const icon = (outcome) => outcome === 'success'
              ? '✅'
              : (outcome === 'skipped' || outcome === '' ? '➖' : '❌');
            
            let comment = '## 🤖 PR Validation Results\n\n';
            
            comment += `### Tests: ${icon(testsOutcome)}\n\n`;
            
            comment += '### Coverage\n';
            if (unitScopeCoverage && unitScopeCoverage !== 'unknown' && unitScopeCoverage !== '') {
              comment += `**Spot unit-test scope coverage (informational): ${unitScopeCoverage}%**\n\n`;
            } else {
              comment += 'Unit-test scope coverage data was not available for this run.\n\n';
            }
            comment += 'This metric excludes package dependencies, test targets, and `Spot/Views/`; those previously made the project aggregate misleading.\n\n';
            comment += `**Changed-line coverage gate (80% minimum): ${icon(coverageOutcome)}**\n\n`;
            
            // Include the per-changed-file coverage breakdown when available.
            try {
              let report = fs.readFileSync('coverage-report.txt', 'utf8');
              // Strip ANSI color codes emitted by the script.
              report = report.replace(/\u001b\[[0-9;]*m/g, '').trim();
              if (report.length > 0) {
                if (report.length > 8000) {
                  report = report.slice(0, 8000) + '\n... (truncated)';
                }
                comment += '<details><summary>Changed-file coverage details</summary>\n\n';
                comment += '```\n' + report + '\n```\n\n';
                comment += '</details>\n\n';
              }
            } catch (e) {
              // No changed production files, or coverage report not generated.
            }
            
            comment += 'See the [validation logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for full details.\n\n';
            
            comment += '---\n';
            comment += '*Automated checks validate tests, coverage, API stability, and documentation.*';
            
            // Find existing bot comment to update
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('PR Validation Results')
            );
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
